<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de Generadores</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#17493b">
<link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--fb:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--fd:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
--bg:#ece8dd;--cd:#fbf9f3;--in:#f2eee3;--tx:#1c211d;--mu:#6c6a5f;--ln:#dcd6c6;--ac:#17493b;--ax:#f6f2e7;--am:#c4791a;--ok:#3b7a4f;--wa:#c98a12;--er:#b3372b;--sh:0 1px 0 rgba(0,0,0,.03),0 12px 28px -18px rgba(50,38,10,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1210;--cd:#171d1a;--in:#0f1512;--tx:#ece8dc;--mu:#9a9a8c;--ln:#28312c;--ac:#e3a743;--ax:#1a1204;--am:#e3a743;--ok:#5aa872;--wa:#e3b040;--er:#e0685b;--sh:0 12px 28px -18px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{--bg:#0e1210;--cd:#171d1a;--in:#0f1512;--tx:#ece8dc;--mu:#9a9a8c;--ln:#28312c;--ac:#e3a743;--ax:#1a1204;--am:#e3a743;--ok:#5aa872;--wa:#e3b040;--er:#e0685b;--sh:0 12px 28px -18px rgba(0,0,0,.7)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 var(--fb);-webkit-text-size-adjust:100%}
header{padding:22px max(16px,calc((100% - 1100px)/2)) 12px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.eb{font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--am);font-weight:700}
h1{font:600 clamp(30px,6vw,44px)/1 var(--fd);text-transform:uppercase;letter-spacing:.03em;margin:4px 0 0}
.qw{min-width:190px}
.qw select{border-radius:999px;padding:10px 16px;font-size:14px;font-weight:600}
nav{display:flex;gap:2px;padding:0 max(10px,calc((100% - 1100px)/2));overflow-x:auto;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--ln)}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;padding:15px 14px 12px;background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);font:600 15px var(--fb);letter-spacing:.02em}
nav button.on{color:var(--tx);border-bottom-color:var(--am)}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;padding:18px max(14px,calc((100% - 1100px)/2)) 48px;align-items:start}
.full,.ok,.c:has(.sc){grid-column:1/-1}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:18px;padding:18px;box-shadow:var(--sh)}
.c h2{font:600 22px/1.1 var(--fd);text-transform:uppercase;letter-spacing:.05em;margin:0 0 6px}
.mu{color:var(--mu);font-size:13.5px}
input,select{font:inherit;padding:12px 14px;border:1.5px solid var(--ln);border-radius:12px;background:var(--in);color:var(--tx);width:100%}
input:focus,select:focus{outline:2px solid var(--am);outline-offset:1px;border-color:transparent}
.r{display:flex;gap:8px;align-items:center;margin:10px 0}
.r b{font:600 20px var(--fd);color:var(--mu)}
.r input{width:100%;max-width:130px;text-align:center;font:600 34px/1.1 var(--fd);padding:8px}
.b{padding:15px 18px;border:0;border-radius:14px;background:var(--ac);color:var(--ax);font:700 15.5px var(--fb);letter-spacing:.03em;width:100%}
.b.s{background:transparent;color:var(--tx);border:1.5px solid var(--ln)}
.er{color:var(--er);font-weight:600;font-size:14px;margin:6px 0}
.ok{background:var(--ok);color:#fff;padding:12px 16px;border-radius:14px;font-weight:600}
.bar{height:12px;background:var(--in);border:1px solid var(--ln);border-radius:9px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;border-radius:9px}
.bar+div b{font:600 40px/1 var(--fd)}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);font-weight:700}
th,td{padding:9px 8px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tr:nth-child(even) td{background:rgba(130,115,70,.06)}
tr.hoy td{font-weight:700;background:rgba(196,121,26,.2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{padding:14px 16px;border:1.5px solid var(--ln);border-radius:999px;background:var(--in);color:var(--tx);font:600 15px var(--fb)}
.chip.on{background:var(--ac);color:var(--ax);border-color:var(--ac)}
.mo{position:fixed;inset:0;background:rgba(8,10,8,.6);z-index:10;overflow:auto;padding:16px}
.mo .c{max-width:560px;margin:20px auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.x{border:0;background:transparent;color:var(--er);font-size:20px;padding:6px 10px}
.tg{width:26px;height:26px;accent-color:var(--ac)}
.mn{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font:600 24px var(--fd);text-transform:uppercase;letter-spacing:.05em}
.mn button{padding:8px 18px;border:1.5px solid var(--ln);background:var(--in);color:var(--tx);border-radius:12px;font-size:18px}
table.hj td:first-child,table.hj th:first-child{position:sticky;left:0;background:var(--cd);z-index:1}
table.hj td{text-align:center}table.hj th{text-align:center;white-space:normal;min-width:84px}
.sy{font-size:12.5px;font-weight:700;color:var(--mu);text-align:right;margin-bottom:6px}
.row .chip{padding:9px 14px;font-size:14px}
details summary{cursor:pointer;padding:6px 0}
</style></head><body>
<header><div><div class="eb">Granja · Energía</div><h1>Control de generadores</h1></div><div class="qw"><div id="sy" class="sy"></div><select id="qn" onchange="setQ(this.value)"></select><button id="adm" class="chip" style="margin-top:8px;padding:8px 14px;font-size:13px;width:100%" onclick="admBtn()"></button></div></header>
<nav id="nav"></nav>
<main id="app"></main>
<div id="mod"></div>
<script>
/* ===== PEGAR AQUÍ LA CONFIGURACIÓN DE FIREBASE (la misma de Galpón de Reemplazos) ===== */
window.FIREBASE_CONFIG={apiKey:"AIzaSyAzoh4UHDyXVt7lpK82NhSanBs6u89j2U8",authDomain:"galpon-reemplazos.firebaseapp.com",projectId:"galpon-reemplazos",storageBucket:"galpon-reemplazos.firebasestorage.app",messagingSenderId:"33289343335",appId:"1:33289343335:web:5efd5550b7745be1645fc2"};
/* ===== FIN DE LA CONFIGURACIÓN ===== */
</script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GENS=[['g1','Generador 1'],['g2','Generador 2'],['g3','Generador 3'],['g4','Generador 4'],['g5','Generador 5'],['g6','Generador 6'],['peq','Generador PEQ']];
const DEF=['Aceite','Filtro de aceite','Filtro de aire','Filtro de combustible (Doosan)','Combustible','Limpia contactos','Desengrasante','Líquido refrigerante','Waipe'];
const TABS=[['reg','Registro'],['hoja','Hoja de registro'],['dia','Diario'],['mes','Mensual'],['man','Mantenimiento'],['ene','Energía y diésel'],['cor','Correcciones'],['aj','Ajustes']];
const mk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const dk=ts=>{const d=new Date(ts);return mk(d)+'-'+String(d.getDate()).padStart(2,'0')};
const S={pend:{},mode:'local',lect:[],mant:[],med:[],cfg:{},tab:'reg',mes:mk(new Date()),db:null,quien:'',err:{},ok:'',sel:[],mod:null};
const cfg=()=>({activos:{},base:{},items:DEF,quienes:[],ciclo:250,dias:3,...S.cfg});
const fh=h=>{const m=Math.round(h*60);return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m'};
const act=()=>GENS.filter(g=>cfg().activos[g[0]]);
const gn=g=>GENS.find(x=>x[0]===g)[1];
const L=g=>S.lect.filter(x=>x.gen===g).sort((a,b)=>a.ts-b.ts);
const fd=ts=>new Date(ts).toLocaleString('es',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const nowL=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};

// Horas por día: reparte las horas trabajadas entre dos lecturas según el tiempo que pasó
function spread(r,f){const o={};for(let i=1;i<r.length;i++){const a=r[i-1],b=r[i],dh=b[f]-a[f],dt=b.ts-a.ts;if(dh<0||dt<=0)continue;let c=a.ts;while(c<b.ts){const d=new Date(c),nx=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime(),e=Math.min(nx,b.ts),k=dk(c);o[k]=(o[k]||0)+dh*(e-c)/dt;c=e}}return o}
const daily=g=>spread(L(g),'h');
function rate(g){const r=L(g);if(r.length<2)return null;const z=r[r.length-1],lim=z.ts-7*864e5;let a=[...r].reverse().find(x=>x.ts<=lim)||r[0];if(a===z)a=r[r.length-2];const dt=(z.ts-a.ts)/864e5;return dt>0?(z.h-a.h)/dt:null}
function base(g){const m=S.mant.filter(x=>x.gen===g).sort((a,b)=>b.ts-a.ts)[0];if(m)return m.h;const c=cfg().base[g];if(typeof c==='number')return c;const r=L(g);return r.length?r[0].h:null}

function render(){if(S.tab==='cor'&&!S.su)S.tab='reg';updAdm();
  $('#nav').innerHTML=TABS.filter(t=>t[0]!=='cor'||S.su).map(t=>`<button class="${S.tab===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
  const q=cfg().quienes;$('#qn').innerHTML='<option value="">¿Quién registra?</option>'+q.map(n=>`<option ${n===S.quien?'selected':''}>${esc(n)}</option>`).join('');
  let h=S.fberr?'<div class="c full er">No se pudo conectar con la nube. Los datos se guardan solo en este dispositivo hasta resolverlo.</div>':S.local?'<div class="c full mu">Modo de prueba: los datos se guardan solo en este dispositivo.</div>':'';
  if(S.ok)h+=`<div class="ok">${esc(S.ok)}</div>`;
  if(S.tab!=='aj')h+=vAv();
  if(S.tab==='aj')h+=vAj();else if(!act().length&&!['ene','hoja'].includes(S.tab))h+='<div class="c"><h2>Sin generadores activos</h2><p class="mu">Todos están inhabilitados. Ve a <b>Ajustes</b> y activa los que estén en uso.</p></div>';
  else h+={reg:vReg,dia:vDia,mes:vMes,man:vMan,ene:vEne,hoja:vHoja,cor:vCor}[S.tab]();
  $('#app').innerHTML=h;
}
const go=t=>{S.tab=t;S.ok='';render();scrollTo(0,0)};
const setQ=v=>{S.quien=v;try{localStorage.setItem('quien',v)}catch(e){}};
const msg=t=>{S.ok=t;render();setTimeout(()=>{S.ok='';render()},3000)};

function vReg(){return act().map(([g,n])=>{const r=L(g),z=r[r.length-1];
 return `<div class="c"><h2>${n}</h2><div class="mu">${z?`Última lectura: <b>${fh(z.h)}</b> · ${fd(z.ts)}${z.quien?' · '+esc(z.quien):''}${S.su&&z.id&&S.mode!=='claude'?` <button class="chip" style="padding:6px 12px;font-size:13px;margin-left:6px" onclick="edit('lect','${z.id}')">Corregir</button>`:''}`:'Aún sin lecturas'}</div>
 <div class="r"><input id="h_${g}" type="number" inputmode="numeric" placeholder="horas"><b>h</b><input id="m_${g}" type="number" inputmode="numeric" placeholder="min"><b>m</b></div>
 <details><summary class="mu">Cambiar fecha y hora de la lectura</summary><input id="t_${g}" type="datetime-local" value="${nowL()}"></details>
 <div class="er" id="er_${g}">${esc(S.err[g]||'')}</div>
 <button class="b" style="margin-top:10px" onclick="guardar('${g}')">Guardar lectura</button></div>`}).join('')}

async function guardar(g){
  const h=parseFloat($('#h_'+g).value),m=parseFloat($('#m_'+g).value||0),tv=$('#t_'+g);
  const E=t=>{S.err[g]=t;const d=$('#er_'+g);if(d)d.textContent=t};
  if(!(h>=0)||!(m>=0&&m<60))return E('Escribe las horas y los minutos (minutos de 0 a 59).');
  const v=h+m/60,ts=tv&&tv.value?new Date(tv.value).getTime():Date.now(),z=L(g).pop();
  if(z){if(ts<=z.ts)return E('La fecha debe ser posterior a la última lectura.');
    if(v<z.h)return E(`Es menor que la última lectura (${fh(z.h)}). Revisa el número.`);
    const el=(ts-z.ts)/36e5;if(v-z.h>el+.1)return E(`Marca ${fh(v-z.h)} de trabajo pero solo pasaron ${fh(el)} desde la última lectura. Revisa el número.`)}
  try{await S.db.collection('lecturas').add({gen:g,h:v,ts,quien:S.quien||''});S.err[g]='';msg('✔ Lectura guardada: '+gn(g)+sv())}catch(e){E('No se pudo guardar. Intenta de nuevo.')}
}

function mesNav(){const [y,m]=S.mes.split('-').map(Number);return `<div class="mn"><button onclick="mv(-1)">◀</button><b>${new Date(y,m-1,1).toLocaleDateString('es',{month:'long',year:'numeric'})}</b><button onclick="mv(1)">▶</button></div>`}
const mv=n=>{const [y,m]=S.mes.split('-').map(Number);S.mes=mk(new Date(y,m-1+n,1));render()};

function vDia(){const A=act(),D=A.map(g=>daily(g[0])),[y,m]=S.mes.split('-').map(Number),n=new Date(y,m,0).getDate(),hoy=dk(Date.now());let rows='',T=A.map(()=>0);
 for(let d=1;d<=n;d++){const k=S.mes+'-'+String(d).padStart(2,'0');let tot=0,any=false;
  const c=D.map((o,i)=>{if(o[k]==null)return '<td>–</td>';any=true;tot+=o[k];T[i]+=o[k];return `<td>${o[k].toFixed(1)}</td>`}).join('');
  rows+=`<tr class="${k===hoy?'hoy':''}"><td>${String(d).padStart(2,'0')}</td>${c}<td>${any?tot.toFixed(1):'–'}</td></tr>`}
 return `<div class="c">${mesNav()}<div class="mu">Horas aproximadas de funcionamiento por día (se reparten según el tiempo entre lecturas).</div><div class="sc"><table><tr><th>Día</th>${A.map(g=>`<th>${g[1].replace('Generador ','G')}</th>`).join('')}<th>Total</th></tr>${rows}<tr><td><b>Mes</b></td>${T.map(t=>`<td><b>${t.toFixed(1)}</b></td>`).join('')}<td><b>${T.reduce((a,b)=>a+b,0).toFixed(1)}</b></td></tr></table></div></div>`}

function vMes(){const A=act(),D=A.map(g=>daily(g[0])),now=new Date(),ms=[];for(let i=0;i<6;i++)ms.push(mk(new Date(now.getFullYear(),now.getMonth()-i,1)));
 const sum=(o,k)=>Object.keys(o).filter(x=>x.startsWith(k)).reduce((a,x)=>a+o[x],0);
 const mx=Math.max(1,...ms.flatMap(k=>D.map(o=>sum(o,k))));
 return `<div class="c"><h2>Horas por mes</h2><div class="mu">Últimos 6 meses, horas aproximadas de funcionamiento.</div><div class="sc"><table><tr><th>Mes</th>${A.map(g=>`<th>${g[1].replace('Generador ','G')}</th>`).join('')}<th>Total</th></tr>${ms.map(k=>{const v=D.map(o=>sum(o,k));return `<tr><td>${k}</td>${v.map(x=>`<td>${x?x.toFixed(0):'–'}</td>`).join('')}<td><b>${v.reduce((a,b)=>a+b,0).toFixed(0)}</b></td></tr>`}).join('')}</table></div></div>
 ${A.map((g,i)=>`<div class="c"><b>${g[1]}</b>${ms.map(k=>{const x=sum(D[i],k);return `<div class="mu" style="margin-top:6px">${k} · ${x.toFixed(0)} h</div><div class="bar"><i style="width:${x/mx*100}%;background:var(--ac)"></i></div>`}).join('')}</div>`).join('')}`}

function vMan(){const c=cfg(),cy=c.ciclo||250;
 const cards=act().map(([g,n])=>{const z=L(g).pop(),b=base(g);
  if(!z||b==null)return `<div class="c"><h2>${n}</h2><p class="mu">Falta la primera lectura para calcular el mantenimiento.</p></div>`;
  const u=Math.max(0,z.h-b),p=u/cy,col=p>=1?'var(--er)':p>=.85?'var(--wa)':'var(--ok)',rt=rate(g),f=cy-u;
  const eta=f<=0?'<b style="color:var(--er)">¡Mantenimiento vencido!</b>':rt>0?`Faltan <b>${f.toFixed(0)} h</b> · aprox. ${Math.round(f/rt)} días (${new Date(Date.now()+f/rt*864e5).toLocaleDateString('es',{day:'2-digit',month:'short'})})`:`Faltan <b>${f.toFixed(0)} h</b>`;
  return `<div class="c"><h2>${n}</h2><div class="bar"><i style="width:${Math.min(100,p*100)}%;background:${col}"></i></div><div><b>${u.toFixed(0)}</b> de ${cy} h desde el último mantenimiento</div><div class="mu">${eta}${rt?` · promedio ${rt.toFixed(1)} h/día`:''}</div><button class="b s" style="margin-top:10px" onclick="abrir('${g}')">🔧 Registrar mantenimiento</button></div>`}).join('');
 const H=S.mant.slice().sort((a,b)=>b.ts-a.ts).slice(0,10).map(m=>`<div class="row"><div><b>${gn(m.gen)}</b> · ${fd(m.ts)}${m.quien?' · '+esc(m.quien):''}<div class="mu">${esc((m.items||[]).join(', '))}${m.nota?' — '+esc(m.nota):''}</div></div><div class="mu">${fh(m.h)}</div></div>`).join('')||'<p class="mu">Aún no hay mantenimientos registrados.</p>';
 const est=act().map(([g,n])=>{const z=L(g).pop(),b=base(g);if(!z||b==null)return null;const u=Math.max(0,z.h-b),f=cy-u,rt=rate(g);return `• ${n}: lleva ${u.toFixed(0)} de ${cy} h desde el último mantenimiento`+(f<=0?' (VENCIDO)':`, faltan ${f.toFixed(0)} h`+(rt>0?` (promedio ${rt.toFixed(1)} h/día, aprox. ${Math.max(1,Math.round(f/rt))} días)`:''))}).filter(Boolean);
 const wa=est.length?`<div class="c"><h2>Enviar estado por WhatsApp</h2><div class="mu">Resumen de todos los generadores activos.</div><a class="b" style="display:block;text-align:center;text-decoration:none;margin-top:8px" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('🔧 Estado de mantenimiento de generadores\n'+est.join('\n'))}">Enviar por WhatsApp</a></div>`:'';
 return wa+cards+`${vHist()}`}

function abrir(g){S.mod=g;S.sel=[];const z=L(g).pop(),h=z?Math.floor(z.h):'',m=z?Math.round((z.h-Math.floor(z.h))*60):'';
 $('#mod').innerHTML=`<div class="mo"><div class="c"><h2>Mantenimiento · ${gn(g)}</h2><div class="mu">Toca lo que se le hizo:</div>
 <div class="chips">${cfg().items.map((it,i)=>`<button class="chip" onclick="tog(this,${i})">${esc(it)}</button>`).join('')}</div>
 <input id="nt" placeholder="Otro / nota (opcional)"><div class="mu" style="margin-top:10px">Horómetro al momento del mantenimiento</div>
 <div class="r"><input id="mh" type="number" inputmode="numeric" value="${h}" placeholder="horas"><b>h</b><input id="mm" type="number" inputmode="numeric" value="${m}" placeholder="min"><b>m</b></div>
 <div id="me" class="er"></div><button class="b" onclick="gMan()">Guardar mantenimiento</button><button class="b s" style="margin-top:8px" onclick="cerrar()">Cancelar</button></div></div>`}
const cerrar=()=>{S.mod=null;$('#mod').innerHTML=''};
function tog(el,i){const it=cfg().items[i],k=S.sel.indexOf(it);k<0?S.sel.push(it):S.sel.splice(k,1);el.classList.toggle('on')}
async function gMan(){const g=S.mod,nota=$('#nt').value.trim(),h=parseFloat($('#mh').value),m=parseFloat($('#mm').value||0);
 if(!S.sel.length&&!nota)return $('#me').textContent='Toca al menos un trabajo realizado.';
 if(!(h>=0))return $('#me').textContent='Escribe el horómetro.';
 try{await S.db.collection('mantenimientos').add({gen:g,ts:Date.now(),h:h+m/60,items:S.sel,nota,quien:S.quien||''});cerrar();msg('✔ Mantenimiento guardado. El contador de 250 h se reinició.'+sv())}catch(e){$('#me').textContent='No se pudo guardar.'}}

function vAj(){const c=cfg();
 return `<div class="c"><h2>Generadores en uso</h2><div class="mu">Activa solo los que estén operando.</div>${GENS.map(([g,n])=>`<div class="row"><label><b>${n}</b></label><input class="tg" type="checkbox" ${c.activos[g]?'checked':''} onchange="cf(x=>x.activos['${g}']=this.checked)"></div>`).join('')}</div>

const tl=ts=>{const d=new Date(ts);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
const qSel=cur=>`<select id="ed_q">${[...new Set([...cfg().quienes,cur].filter(Boolean))].map(n=>`<option ${n===cur?'selected':''}>${esc(n)}</option>`).join('')}</select>`;
const desc=(t,x)=>t==='lect'?`${gn(x.gen)} · ${fh(x.h)}`:t==='mant'?`${gn(x.gen)} · ${esc((x.items||[]).join(', '))||'—'} · ${fh(x.h)}`:`${(MED.find(m=>m[0]===x.tipo)||[0,x.tipo])[1]} · ${x.v}`;
const needQ=()=>{if(S.su&&Date.now()-S.suTs<9e5){S.suTs=Date.now();return false}S.su=false;msg('Solo el administrador puede corregir. Entra con tu PIN.');return true};
const chk=(o,ts,v,k,f)=>{const pv=o.filter(r=>r.ts<ts).sort((a,b)=>b.ts-a.ts)[0],nx=o.filter(r=>r.ts>ts).sort((a,b)=>a.ts-b.ts)[0];return pv&&v<pv[k]?'Es menor que la lectura anterior ('+f(pv[k])+').':nx&&v>nx[k]?'Es mayor que la lectura siguiente ('+f(nx[k])+').':''};
function vCor(){if(!S.su)return '';const t=S.ct||'lect',an=S.ca;
 if(S.mode==='claude')return '<div class="c full"><h2>Correcciones</h2><p class="mu">Esta opción solo está en la versión de GitHub.</p></div>';
 const rows=(S[t+'All']||[]).slice().sort((a,b)=>b.ts-a.ts).filter(x=>an||!x.anulado).slice(0,40).map(x=>`<div class="row" style="align-items:flex-start;${x.anulado?'opacity:.6':''}"><div><b>${fdy(x.ts)}</b>${x.anulado?' <span class="er">ANULADO</span>':''}${x.edit?' <span class="mu">(corregido)</span>':''}<div>${desc(t,x)}</div><div class="mu">Registró: ${x.quien?esc(x.quien):'sin registrar'}${x.anulado&&x.motivo?' · Motivo: '+esc(x.motivo):''}</div></div><div style="display:flex;gap:6px;flex-direction:column">${x.anulado?`<button class="chip" onclick="rest('${t}','${x.id}')">Restaurar</button>`:`<button class="chip" onclick="edit('${t}','${x.id}')">Editar</button><button class="chip" onclick="anul('${t}','${x.id}')">Anular</button>`}</div></div>`).join('')||'<p class="mu">No hay registros.</p>';
 return `<div class="c full"><h2>Correcciones</h2><div class="mu">Corrige registros mal escritos. Nada se borra: lo anulado queda guardado y se puede restaurar. Quedan guardados el nombre de quien corrige y los valores de antes.</div><div class="chips">${TIPOS.map(([k,l])=>`<button class="chip ${k===t?'on':''}" onclick="S.ct='${k}';render()">${l}</button>`).join('')}</div><label class="mu"><input type="checkbox" style="width:auto" ${an?'checked':''} onchange="S.ca=this.checked;render()"> Mostrar anulados</label>${rows}<div class="mu" style="margin-top:8px">Se muestran los 40 más recientes.</div></div>`}
function edit(t,id){if(needQ())return;const x=findR(t,id);if(!x)return;S.mod='ed';S.ed={t,id};let f='';
 if(t!=='med'){const [h,m]=hmOf(x.h);f+=`<div class="mu">Generador</div><select id="ed_g">${GENS.map(g=>`<option value="${g[0]}" ${g[0]===x.gen?'selected':''}>${g[1]}</option>`).join('')}</select><div class="mu" style="margin-top:10px">Horómetro</div><div class="r"><input id="ed_h" type="number" inputmode="numeric" value="${h}"><b>h</b><input id="ed_m" type="number" inputmode="numeric" value="${m}"><b>m</b></div>`}
 if(t==='mant'){const nm=[...new Set([...cfg().items,...(x.items||[])])];f+=`<div class="mu">Trabajos realizados</div><div class="chips">${nm.map(n=>`<button class="chip ${(x.items||[]).includes(n)?'on':''}" data-n="${esc(n)}" onclick="this.classList.toggle('on')">${esc(n)}</button>`).join('')}</div><input id="ed_nt" value="${esc(x.nota||'')}" placeholder="Nota (opcional)">`}
 if(t==='med')f+=`<div class="mu">${(MED.find(m=>m[0]===x.tipo)||[0,x.tipo])[1]}</div><input id="ed_v" type="number" inputmode="decimal" step="any" value="${x.v}">`;
 f+=`<div class="mu" style="margin-top:10px">Fecha y hora</div><input id="ed_t" type="datetime-local" value="${tl(x.ts)}"><div class="mu" style="margin-top:10px">Quién lo registró</div>${qSel(x.quien||'')}`;
 $('#mod').innerHTML=`<div class="mo"><div class="c"><h2>Corregir registro</h2>${f}<div id="ed_e" class="er"></div><button class="b" onclick="saveEd()">Guardar corrección</button><button class="b s" style="margin-top:8px" onclick="cerrar()">Cancelar</button></div></div>`}
async function saveEd(){if(!S.su){cerrar();return msg('Sesión de administrador vencida. Entra de nuevo.')}const {t,id}=S.ed,x=findR(t,id),E=m=>{$('#ed_e').textContent=m},ts=new Date($('#ed_t').value).getTime();
 if(!ts)return E('Revisa la fecha y la hora.');
 const p={ts,quien:$('#ed_q').value};let e='';
 if(t!=='med'){const h=parseFloat($('#ed_h').value),m=parseFloat($('#ed_m').value||0);if(!(h>=0)||!(m>=0&&m<60))return E('Escribe las horas y los minutos (minutos de 0 a 59).');
  const v=h+m/60,g=$('#ed_g').value;p.gen=g;p.h=v;if(t==='lect')e=chk(S.lect.filter(r=>r.gen===g&&r.id!==id),ts,v,'h',fh)}
 if(t==='mant'){p.items=[...document.querySelectorAll('#mod .chip.on')].map(b=>b.dataset.n);p.nota=$('#ed_nt').value.trim();if(!p.items.length&&!p.nota)return E('Marca al menos un trabajo.')}
 if(t==='med'){const v=parseFloat($('#ed_v').value);if(!(v>=0))return E('Revisa el número.');p.v=v;if(x.tipo!=='dcal')e=chk(S.med.filter(r=>r.tipo===x.tipo&&r.id!==id),ts,v,'v',n=>n)}
 if(e)return E(e);
 p.edit={por:S.quien||'Administrador',ts:Date.now(),antes:clean({ts:x.ts,quien:x.quien||'',gen:x.gen,h:x.h,items:x.items,nota:x.nota,v:x.v})};
 try{await S.db.collection(COL[t]).update(id,clean(p));cerrar();msg('✔ Corrección guardada'+sv())}catch(err){E('No se pudo guardar. Intenta de nuevo.')}}
function anul(t,id){if(needQ())return;const x=findR(t,id);if(!x)return;S.mod='ed';S.ed={t,id};
 $('#mod').innerHTML=`<div class="mo"><div class="c"><h2>¿Anular este registro?</h2><p>${fdy(x.ts)}<br>${desc(t,x)}</p><div class="mu">No se borra: queda guardado como anulado y se puede restaurar.</div><input id="an_m" placeholder="Motivo (ej. lectura mal escrita)" style="margin:10px 0"><div id="ed_e" class="er"></div><button class="b" onclick="saveAn()">Sí, anular</button><button class="b s" style="margin-top:8px" onclick="cerrar()">Cancelar</button></div></div>`}
async function saveAn(){if(!S.su){cerrar();return msg('Sesión de administrador vencida. Entra de nuevo.')}const {t,id}=S.ed;try{await S.db.collection(COL[t]).update(id,{anulado:true,anulado_por:S.quien||'Administrador',anulado_ts:Date.now(),motivo:$('#an_m').value.trim()});cerrar();msg('✔ Registro anulado'+sv())}catch(e){$('#ed_e').textContent='No se pudo guardar.'}}
async function rest(t,id){if(needQ())return;try{await S.db.collection(COL[t]).update(id,{anulado:false,motivo:'',restaurado_por:S.quien||'Administrador',restaurado_ts:Date.now()});msg('✔ Registro restaurado'+sv())}catch(e){}}


// ===== Administrador (super usuario) =====
const updAdm=()=>{const el=$('#adm');if(el)el.textContent=S.su?'🔓 Administrador · Salir':'🔒 Administrador'};
async function hashPin(p){const t='gen|'+p;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of t)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'x'+h}}
function pinModal(mode){S.mod='adm';const nu=mode==='new'||!cfg().adminPin;
 $('#mod').innerHTML=`<div class="mo"><div class="c"><h2>${nu?'Crear PIN de administrador':'Administrador'}</h2><div class="mu">${nu?'Elige un PIN de 4 a 6 números. Solo tú debes conocerlo.':'Escribe el PIN de administrador.'}</div><input id="pn1" type="password" inputmode="numeric" maxlength="6" placeholder="PIN" style="margin:10px 0;font-size:24px;text-align:center">${nu?'<input id="pn2" type="password" inputmode="numeric" maxlength="6" placeholder="Repite el PIN" style="margin-bottom:10px;font-size:24px;text-align:center">':''}<div id="ed_e" class="er"></div><button class="b" onclick="pinOk(${nu})">${nu?'Guardar PIN':'Entrar'}</button><button class="b s" style="margin-top:8px" onclick="cerrar()">Cancelar</button></div></div>`;setTimeout(()=>{const i=$('#pn1');if(i)i.focus()},50)}
async function pinOk(nu){const E=m=>{$('#ed_e').textContent=m},v=$('#pn1').value.trim();
 if(S.pl&&Date.now()<S.pl)return E('Demasiados intentos. Espera 30 segundos.');
 if(!/^\d{4,6}$/.test(v))return E('El PIN debe tener de 4 a 6 números.');
 if(nu){if(v!==$('#pn2').value.trim())return E('Los dos PIN no coinciden.');if(S.mode==='nube'&&!S.cfgLoaded)return E('Espera un momento a que cargue la conexión.');const h=await hashPin(v);await cf(x=>{x.adminPin=h})}
 else if(await hashPin(v)!==cfg().adminPin){S.pf=(S.pf||0)+1;if(S.pf>=5){S.pl=Date.now()+3e4;S.pf=0}return E('PIN incorrecto.')}
 S.pf=0;S.su=true;S.suTs=Date.now();cerrar();msg(nu?'✔ PIN guardado. Ya eres administrador.':'✔ Administrador activo')}
const admBtn=()=>{if(S.su){S.su=false;render();msg('Sesión de administrador cerrada.')}else pinModal()};
document.addEventListener('pointerdown',()=>{if(S.su)S.suTs=Date.now()});
setInterval(()=>{if(S.su&&Date.now()-S.suTs>9e5){S.su=false;render()}},30000);

let pend=0;
function up(){const a=document.activeElement;if(a&&a.tagName==='INPUT'&&!S.mod){pend=1;return}if(S.mod)return;render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pend&&!(document.activeElement&&document.activeElement.tagName==='INPUT')){pend=0;render()}},80));
(async()=>{try{S.quien=localStorage.getItem('quien')||''}catch(e){}
 render();
 let db=null;
 try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
 try{db=await fbDB();if(db)S.mode='nube'}catch(e){console.error(e);db=null}
 S.fberr=!db&&cfgOk();
 if(!db){try{db=window.claude&&await claude.use('db');if(db)S.mode='claude'}catch(e){db=null}}
 S.local=!db;db=db||localDB();S.db=db;updSync();
 db.doc('config/main').onSnapshot(s=>{S.cfg=s.data()||{};S.cfgLoaded=1;up()},()=>{});
 db.collection('lecturas').onSnapshot(s=>{S.lectAll=s.docs.map(d=>({...d.data(),id:d.id}));S.lect=S.lectAll.filter(x=>!x.anulado);up()},()=>{});
 db.collection('medidores').onSnapshot(s=>{S.medAll=s.docs.map(d=>({...d.data(),id:d.id}));S.med=S.medAll.filter(x=>!x.anulado);up()},()=>{});
 db.collection('mantenimientos').onSnapshot(s=>{S.mantAll=s.docs.map(d=>({...d.data(),id:d.id}));S.mant=S.mantAll.filter(x=>!x.anulado);up()},()=>{});
 render();
})();
</script></body></html>
